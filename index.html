const D={"j":{"_说明":"《老时辰全集》查询工具核心数据 v1.0（2026-11-12）。文字内容见 02-内容数据库.md，本文件只供程序读取：时辰对照、月份对照、2026节气表、夏令时规则。不得自行增改数据。","dst_china_1986_1991":{"_规则":"出生日期落在当年起止区间内（含起始日 02:00 起，至结束日 02:00 止），出生证钟点须拨回 1 小时再对时辰；切换日当天 00:00–02:00 按标准时间计（结束日）/夏令时尚未开始（起始日的 02:00 前）。命中时查询结果须显示夏令时提示并引用内容库第五部分第一节。","periods":[{"end":"1986-09-14","start":"1986-05-04","year":1986},{"end":"1987-09-13","start":"1987-04-12","year":1987},{"end":"1988-09-11","start":"1988-04-17","year":1988},{"end":"1989-09-17","start":"1989-04-16","year":1989},{"end":"1990-09-16","start":"1990-04-15","year":1990},{"end":"1991-09-15","start":"1991-04-14","year":1991}]},"jieqi_2026":[{"date":"2026-01-05","name":"小寒"},{"date":"2026-01-20","name":"大寒"},{"date":"2026-02-04","name":"立春"},{"date":"2026-02-18","name":"雨水"},{"date":"2026-03-05","name":"惊蛰"},{"date":"2026-03-20","name":"春分"},{"date":"2026-04-05","name":"清明"},{"date":"2026-04-20","name":"谷雨"},{"date":"2026-05-05","name":"立夏"},{"date":"2026-05-21","name":"小满"},{"date":"2026-06-05","name":"芒种"},{"date":"2026-06-21","name":"夏至"},{"date":"2026-07-07","name":"小暑"},{"date":"2026-07-23","name":"大暑"},{"date":"2026-08-07","name":"立秋"},{"date":"2026-08-23","name":"处暑"},{"date":"2026-09-07","name":"白露"},{"date":"2026-09-23","name":"秋分"},{"date":"2026-10-08","name":"寒露"},{"date":"2026-10-23","name":"霜降"},{"date":"2026-11-07","name":"立冬"},{"date":"2026-11-22","name":"小雪"},{"date":"2026-12-07","name":"大雪"},{"date":"2026-12-22","name":"冬至"}],"leap_month_rule":{"_规则":"闰月沿用所补月份的名称与排位（如闰五月仍为五月·榴月·仲夏，古称后五月）；生日不推迟。示例：1971 年闰五月廿四 = 公历 1971-07-16（历算核定）；下一个闰五月在 2028 年。"},"months":[{"alias":"端月","alias2":["元月","新正"],"name":"正月","num":1,"seasonRank":"孟春"},{"alias":"杏月","alias2":[],"name":"二月","num":2,"seasonRank":"仲春"},{"alias":"桃月","alias2":[],"name":"三月","num":3,"seasonRank":"季春"},{"alias":"槐月","alias2":["清和月"],"name":"四月","num":4,"seasonRank":"孟夏"},{"alias":"榴月","alias2":["蒲月"],"name":"五月","num":5,"seasonRank":"仲夏"},{"alias":"荷月","alias2":[],"name":"六月","num":6,"seasonRank":"季夏"},{"alias":"巧月","alias2":[],"name":"七月","num":7,"seasonRank":"孟秋"},{"alias":"桂月","alias2":[],"name":"八月","num":8,"seasonRank":"仲秋"},{"alias":"菊月","alias2":[],"name":"九月","num":9,"seasonRank":"季秋"},{"alias":"阳月","alias2":[],"name":"十月","num":10,"seasonRank":"孟冬"},{"alias":"冬月","alias2":["辜月"],"name":"十一月","num":11,"seasonRank":"仲冬"},{"alias":"腊月","alias2":["嘉平月","冰月"],"name":"十二月","num":12,"seasonRank":"季冬"}],"shichen":[{"alias":"夜半","crossDay":true,"end":"01:00","name":"子时","start":"23:00","zodiac":"鼠"},{"alias":"鸡鸣","end":"03:00","name":"丑时","start":"01:00","zodiac":"牛"},{"alias":"平旦","end":"05:00","name":"寅时","start":"03:00","zodiac":"虎"},{"alias":"日出","end":"07:00","name":"卯时","start":"05:00","zodiac":"兔"},{"alias":"食时","end":"09:00","name":"辰时","start":"07:00","zodiac":"龙"},{"alias":"隅中","end":"11:00","name":"巳时","start":"09:00","zodiac":"蛇"},{"alias":"日中","end":"13:00","name":"午时","start":"11:00","zodiac":"马"},{"alias":"日昳","end":"15:00","name":"未时","start":"13:00","zodiac":"羊"},{"alias":"晡时","end":"17:00","name":"申时","start":"15:00","zodiac":"猴"},{"alias":"日入","end":"19:00","name":"酉时","start":"17:00","zodiac":"鸡"},{"alias":"黄昏","end":"21:00","name":"戌时","start":"19:00","zodiac":"狗"},{"alias":"人定","end":"23:00","name":"亥时","start":"21:00","zodiac":"猪"}],"shichen_rules":{"boundary":"整点交班：区间含起点不含终点，如 07:00 整属辰时，09:00 整属巳时","zi_cross_day":"23:00–24:00 出生记当天，00:00–01:00 出生记次日，时辰同为子时"}},"sc":[{"name":"子时","hours":"23:00–01:00","alias":"夜半","zodiac":"鼠","items":[["由来","一天十二时辰的头一个。古人把深夜正中叫「夜半」，张继《枫桥夜泊》写的就是它：「月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。」"],["大白话","晚上 11 点到凌晨 1 点。现代人按 0 点换日子，出生证上 23 点多出生，记的是当天。"],["古人在干什么","万籁此俱寂，只有更夫打更——子时正当三更（23:00–01:00 称三更）。"],["老话印象","老辈人说这个时辰是「一日之计的种子」，一天其实从半夜里悄悄开始。"],["人情话","夜里安生，白天才有精神，这个时辰出生的，多半沾着一份静气。"]],"tag":"可靠性标签：典籍（别名、诗句）；流传（老话印象）"},{"name":"丑时","hours":"01:00–03:00","alias":"鸡鸣","zodiac":"牛","items":[["由来","《诗经·郑风·女曰鸡鸣》开篇就是「女曰鸡鸣，士曰昧旦」——妻子听见鸡叫，催丈夫天快亮了该起身。"],["大白话","凌晨 1 点到 3 点。老话讲「鸡叫三遍」多在丑时末到寅时头，头遍鸡鸣就落在这个时辰里。"],["古人在干什么","夜里最沉的一段，四更天。赶早集、赶科考的人，这个时辰已经在洗脸束装了。"],["老话印象","老辈人夸人勤快，说「起在鸡鸣时」。"],["人情话","这个时辰是黑夜最深、也是离天亮最近的地方，熬过去就是光。"]],"tag":"可靠性标签：典籍（诗经）；流传（老话印象）"},{"name":"寅时","hours":"03:00–05:00","alias":"平旦","zodiac":"虎","items":[["由来","「平旦」是天蒙蒙亮、昼夜刚平分的时刻，《诗经》里妻子催的那句「士曰昧旦」，昧旦、平旦说的是同一段天色。"],["大白话","凌晨 3 点到 5 点，五更天。寅配虎，老辈人说这时老虎最活跃，所以寅时又常被叫作「虎时」（民间说法）。"],["古人在干什么","皇帝上早朝、官员点卯都在这前后；农人起身喂牲口、看天色定一天的活。"],["老话印象","「五更起床，胜过吃补药」是老辈人的勤快观，讲的是作息，不是药效。"],["人情话","这个时辰出生的人，老话里说带着一股「赶早」的劲儿，天没亮就先醒三分。"]],"tag":"可靠性标签：典籍（别名）；流传（虎时、老话印象）"},{"name":"卯时","hours":"05:00–07:00","alias":"日出","zodiac":"兔","items":[["由来","太阳冒出地平线的时辰，所以叫「日出」。官府清晨点名叫「点卯」，就是从这个时辰来的。"],["大白话","早上 5 点到 7 点。"],["古人在干什么","「日出而作」——下地、开市、孩童上学堂，一天的正经事从这个时辰铺开。"],["老话印象","老家叫法各地不同，有叫「冒时」的，是方言把「卯」读走了音，听着亲切。"],["人情话","这个时辰的光是新的，一天里最干净的两个小时。"]],"tag":"可靠性标签：典籍（别名、点卯）；流传（方言叫法）"},{"name":"辰时","hours":"07:00–09:00","alias":"食时","zodiac":"龙","items":[["由来","吃早饭的时辰，所以叫「食时」。《说文解字》讲「辰，震也」——三月阳气动，雷始发声，万物舒展，辰字本身带着动起来的意思。"],["大白话","早上 7 点到 9 点。秦汉人一天吃两顿：早上这顿叫「饔」，傍晚那顿叫「飧」；出土简牍里记着秦汉人的早餐，有粥、有饼、有菜羹。"],["古人在干什么","吃完早饭才开工——下地、上值、开市，辰时是古代社会的「上班时间」。"],["老话印象","辰配龙，老辈人打趣说辰时出生的沾着龙的舒展劲儿（打趣，非断语）。"],["人情话","一日之计在于晨，辰时的饭吃踏实了，一天都有底气。"]],"tag":"可靠性标签：典籍（别名、说文、两餐制见简牍与礼制记载）；流传（老话印象）"},{"name":"巳时","hours":"09:00–11:00","alias":"隅中","zodiac":"蛇","items":[["由来","「隅中」是太阳走到东南角的意思——太阳升到半高，还没到正中。"],["大白话","上午 9 点到 11 点。"],["古人在干什么","集市最热闹的一段。汉代长安、唐代洛阳的市，都在这个时辰人声鼎沸；读书人则是晨读之后正课最紧的时候。"],["老话印象","老辈人说巳时是「半上午」，劲头最足、太阳最旺的开头。"],["人情话","这个时辰的光不烈不弱，正是做事的好时候。"]],"tag":"可靠性标签：典籍（别名）；流传（老话印象）"},{"name":"午时","hours":"11:00–13:00","alias":"日中","zodiac":"马","items":[["由来","太阳正当头顶，叫「日中」。《易经》里有「日中为市」——正午设集市，聚天下之货，这是中国集市最早的出处之一。"],["大白话","上午 11 点到下午 1 点。午配马，马是十二生肖里阳气最盛的配属。"],["古人在干什么","赶集、歇晌。农人避开正当午的日头，回家吃口东西、眯一觉，下午再战。"],["老话印象","「午时三刻」在老戏文里是行刑的时辰，那是戏文规矩，不是日常——日常里的午时是集市和饭香。"],["人情话","一天过了一半，这个时辰出生的人，老话里说占着「正大光明」四个字。"]],"tag":"可靠性标签：典籍（别名、日中为市）；流传（老话印象）"},{"name":"未时","hours":"13:00–15:00","alias":"日昳","zodiac":"羊","items":[["由来","「昳」是太阳偏西——日头过了正中，往西斜过去，未时就开始了。"],["大白话","下午 1 点到 3 点。"],["古人在干什么","歇晌起来，喝杯茶，下午的活计重新铺开；羊群这时最安静，未配羊，正合这份安稳。"],["老话印象","老辈人说未时是「一天里最犯困的时辰」，讲究的人家这个时辰不催孩子读书，先眯一会儿。"],["人情话","太阳偏西不是落山，是把上午的劲儿收一收，攒着慢慢用。"]],"tag":"可靠性标签：典籍（别名）；流传（老话印象）"},{"name":"申时","hours":"15:00–17:00","alias":"晡时","zodiac":"猴","items":[["由来","「晡」是申时的一顿饭——古人两餐制，第二顿「飧」就落在这个时辰前后，所以申时叫晡时。"],["大白话","下午 3 点到 5 点。申配猴，猴子这个时辰最活跃，山里猴鸣不断，老辈人说申时的名字和猴叫有关（民间说法）。"],["古人在干什么","吃第二顿饭、收工回家、孩童放学堂。"],["老话印象","「申时茶」是一些地方的老讲究，下午这杯茶，解乏也续劲儿。"],["人情话","这个时辰是一天里「收尾收得漂亮」的时辰，活干完了，饭也吃上了。"]],"tag":"可靠性标签：典籍（别名、两餐制）；流传（猴鸣、申时茶）"},{"name":"酉时","hours":"17:00–19:00","alias":"日入","zodiac":"鸡","items":[["由来","太阳落山，叫「日入」。《诗经·君子于役》唱「日之夕矣，羊牛下来」；《鸡栖于埘》说的也是这个时辰——鸡回窝了。"],["大白话","下午 5 点到晚上 7 点。酉配鸡，鸡归巢正是这个点儿。"],["古人在干什么","「日入而息」——收工、做晚饭（两餐制之外，晚饭的习惯是后世慢慢加上来的）、一家团坐。"],["老话印象","老辈人管这个时辰叫「煮饭时」，闻到谁家烟囱的饭香，就知道酉时到了。"],["人情话","这个时辰的光是暖的，是往家里走的光。"]],"tag":"可靠性标签：典籍（别名、诗经）；流传（老话印象）"},{"name":"戌时","hours":"19:00–21:00","alias":"黄昏","zodiac":"狗","items":[["由来","太阳刚落山、天色将暗未暗，叫「黄昏」。宋人词里「月上柳梢头，人约黄昏后」，约的就是这个时辰。"],["大白话","晚上 7 点到 9 点。戌配狗，狗在这个时辰开始守夜。"],["古人在干什么","华灯初上，一家人围坐说话、做针线、给孩子讲古——戌时是古人的「家庭时间」。"],["老话印象","老辈人说黄昏是一天里「最有人情味」的两个小时，忙了一天，人终于慢下来了。"],["人情话","这个时辰出生的人，老话里说沾着灯火气，顾家、念旧（印象，非断语）。"]],"tag":"可靠性标签：典籍（别名）；流传（老话印象）"},{"name":"亥时","hours":"21:00–23:00","alias":"人定","zodiac":"猪","items":[["由来","「人定」是人定下来、安歇了的意思。《孔雀东南飞》里写：「奄奄黄昏后，寂寂人定初。」黄昏之后，就是人定。"],["大白话","晚上 9 点到 11 点，十二时辰的最后一个。"],["古人在干什么","洗漱、安寝。亥配猪，猪在这个时辰睡得最沉，老辈人说亥时是「连猪都睡了」的时辰。"],["老话印象","「人定胜天」是后人借这两个字说的话，老话本意只讲作息：到点儿了，就该歇。"],["人情话","一天的最后一站，这个时辰出生的人，老话里说占着一个「安」字。"]],"tag":"可靠性标签：典籍（别名、孔雀东南飞）；流传（老话印象）"}],"yf":[{"name":"正月","ya":"端月（元月、新正）","rank":"孟春","jieqi":"立春、雨水","items":[["由来","「端」是开端，正月是一年的头一个月，所以叫端月；秦代避始皇讳改「正」读 zhēng 的说法流传很广（流传）。"],["节日","初一春节、初五破五、初七人日（相传女娲造人，初七造人）、十五元宵、廿五填仓节。"],["老讲究","《占书》把正月头七天配六畜与人：初一鸡、初二狗、初三猪、初四羊、初五牛、初六马、初七人，图六畜兴旺、人寿年丰。"],["人情话","半年的节日都塞在这一个月里，正月生的人，老话里说占着「开门红」。"]],"tag":"可靠性标签：典籍（占书六畜序、节日）；流传（避讳说）"},{"name":"二月","ya":"杏月","rank":"仲春","jieqi":"惊蛰、春分","items":[["由来","杏花开的月份。仲春二月，杏花一开，春就深了。"],["节日","初二龙抬头（理发、炒豆的老讲究）、初三文昌诞（相传）、十二花朝节（相传是百花的生日，踏青赏花、给花枝系红布「赏红」）。"],["人情话","杏月生的人，老话里说沾着仲春的和气，不急不躁，日子有长势。"]],"tag":"可靠性标签：典籍（雅称、龙抬头习俗）；流传（文昌诞、花朝）"},{"name":"三月","ya":"桃月","rank":"季春","jieqi":"清明、谷雨","items":[["由来","桃花开的月份。《诗经·溱洧》写的就是三月三上巳日，青年男女在溱水、洧水边踏青的情景；王羲之《兰亭集序》记的也是永和九年三月三的修禊雅集。"],["节气节日","清明多在本月（扫墓踏青）、谷雨；初三上巳、十五赵公明诞（相传）、三月三「生轩辕」（相传）。"],["人情话","桃月是春天的收尾，桃花落尽、绿荫初成，这个月生的人赶上了春最盛的一程。"]],"tag":"可靠性标签：典籍（诗经、兰亭集序）；流传（诞辰类）"},{"name":"四月","ya":"槐月（清和月）","rank":"孟夏","jieqi":"立夏、小满","items":[["由来","槐花开的月份；又叫清和月，天气清朗和暖。孟夏，四月是夏天的头一个月。"],["节日","初八浴佛节（相传为佛诞，庙里浴佛、开庙会）、十四吕祖诞（相传）、廿八药王庙会。"],["人情话","槐月生的人，老话里说占着清和二字，日子清清爽爽。"]],"tag":"可靠性标签：典籍（雅称）；流传（诞辰类）"},{"name":"五月","ya":"榴月（蒲月）","rank":"仲夏","jieqi":"芒种、夏至","items":[["由来","石榴花开的月份；又叫蒲月，端午挂菖蒲。韩愈写它：「五月榴花照眼明。」"],["节日","初五端午（包粽子、挂菖蒲艾草、佩香囊；问候说「安康」）。"],["老讲究","五月湿热，蚊虫多，古人称「毒月」——说的是节气物候，提醒防暑防虫，不是对人。端午的菖蒲、艾草、香囊，全是护着人的老习俗。"],["人情话","仲夏五月，白天最长、阳气最足，这个月生的人老话里说占着一股旺劲。"]],"tag":"可靠性标签：典籍（雅称、诗句）；科普（毒月释义）"},{"name":"六月","ya":"荷月","rank":"季夏","jieqi":"小暑、大暑","items":[["由来","荷花开的月份。季夏，夏天的第三个月。"],["节日","初六天贶节，老讲究是「六月六，晒红绿」——晒衣、晒书、晒被，防霉防蛀。"],["人情话","荷月生的人，老话里说像盛夏的荷，出水亭亭、清清爽爽。"]],"tag":"可靠性标签：典籍（雅称）；流传（晒红绿）"},{"name":"七月","ya":"巧月","rank":"孟秋","jieqi":"立秋、处暑","items":[["由来","七夕乞巧的月份。孟秋，秋天的头一个月。"],["节日","初七七夕（姑娘们穿针乞巧）、十五中元（祭祖）、廿二财神节（部分地区流传）。"],["人情话","巧月生的人，老话里说手巧心灵——「巧」字就落在月份名里。"]],"tag":"可靠性标签：典籍（雅称、七夕）；流传（财神节）"},{"name":"八月","ya":"桂月","rank":"仲秋","jieqi":"白露、秋分","items":[["由来","桂花开的月份。仲秋，月亮一年里最圆的月份，中秋在正中。白居易忆江南，记得吴宫的桂花酒。"],["节日","十五中秋（团圆、吃月饼）、十八钱塘江观潮（苏轼：「八月十八潮，壮观天下无」）。"],["老讲究","民间爱说「十五的月亮十六圆」，许多年份满月正落在十六。"],["人情话","桂月生的人，老话里说人淡香长——李清照写桂花：「暗淡轻黄体性柔，情疏迹远只香留。」"]],"tag":"可靠性标签：典籍（雅称、诗句）；流传（十六圆）"},{"name":"九月","ya":"菊月","rank":"季秋","jieqi":"寒露、霜降","items":[["由来","菊花开的月份。季秋，秋天的第三个月。"],["节日","初九重阳（登高、赏菊、饮菊花酒、敬老；「九九」图长久）、十九观音出家日（相传）。"],["人情话","菊月生的人，老话里说耐寒长久，像秋天最后开的花，越冷越有精神。"]],"tag":"可靠性标签：典籍（雅称、重阳）；流传（观音出家日）"},{"name":"十月","ya":"阳月","rank":"孟冬","jieqi":"立冬、小雪","items":[["由来","入冬了天却回暖，民间叫「小阳春」，这个月因此叫阳月。孟冬，冬天的头一个月。"],["节日","初一寒衣节（与清明、中元并称三大祭祖节日，送寒衣、念先人）、十五下元节（相传）。"],["人情话","阳月生的人，老话里说占着暖冬的头，冷天里带着暖意。"]],"tag":"可靠性标签：典籍（雅称、寒衣节）；流传（下元）"},{"name":"十一月","ya":"冬月（辜月）","rank":"仲冬","jieqi":"大雪、冬至","items":[["由来","冬意最浓的月份，所以直接叫冬月；《尔雅》里它还有个名字叫「辜月」。仲冬，冬天的第二个月，冬至在本月。"],["老讲究","冬至是一年里白天最短的一天；老话「吃了冬至面，一天长一线」——从冬至起，白天一天比一天长。"],["人情话","冬月生的人，老话里说占着「长一线」的盼头，日子一天比一天亮。"]],"tag":"可靠性标签：典籍（尔雅、冬至天文）；流传（冬至面谚语）"},{"name":"十二月","ya":"腊月（嘉平月、冰月）","rank":"季冬","jieqi":"小寒、大寒","items":[["由来","一年的最后一个月。嘉平月是它的古称之一（见《尔雅》一系的岁时记载）。季冬，冬天的第三个月。"],["节日","初八腊八（喝腊八粥，传说与寺院施粥、纪念先人等多种说法并存，均属流传）、廿三北方小年祭灶/廿四南方小年与扫房子、除夕（腊月最后一天，大月三十、小月廿九即是除夕）。"],["备年谣（流传）","廿三糖瓜粘、廿四扫房子、廿六去买肉、廿七宰年鸡、廿八把面发、廿九蒸馒头、三十晚上熬一宿。"],["人情话","腊月生的人，老话里说生在「收得圆满」的月份，年味最浓时来到世上。"]],"tag":"可靠性标签：典籍（雅称、腊八日期）；流传（腊八来历、备年谣）"}],"scTable":[["子时","23:00–01:00","夜半","鼠"],["丑时","01:00–03:00","鸡鸣","牛"],["寅时","03:00–05:00","平旦","虎"],["卯时","05:00–07:00","日出","兔"],["辰时","07:00–09:00","食时","龙"],["巳时","09:00–11:00","隅中","蛇"],["午时","11:00–13:00","日中","马"],["未时","13:00–15:00","日昳","羊"],["申时","15:00–17:00","晡时","猴"],["酉时","17:00–19:00","日入","鸡"],["戌时","19:00–21:00","黄昏","狗"],["亥时","21:00–23:00","人定","猪"]],"scSmall":"别名顺序出《淮南子·天文训》；钟点为现代通行对照。可靠性标签：典籍","yfTable":[["正月","端月（元月、新正）","孟春","立春、雨水"],["二月","杏月","仲春","惊蛰、春分"],["三月","桃月","季春","清明、谷雨"],["四月","槐月（清和月）","孟夏","立夏、小满"],["五月","榴月（蒲月）","仲夏","芒种、夏至"],["六月","荷月","季夏","小暑、大暑"],["七月","巧月","孟秋","立秋、处暑"],["八月","桂月","仲秋","白露、秋分"],["九月","菊月","季秋","寒露、霜降"],["十月","阳月","孟冬","立冬、小雪"],["十一月","冬月（辜月）","仲冬","大雪、冬至"],["十二月","腊月（嘉平月、冰月）","季冬","小寒、大寒"]],"yfSmall":"孟、仲、季是古人给一季三个月排的座次：孟第一、仲第二、季第三。雅称多来自这个月的花信与物候，见历代诗词与岁时记载。可靠性标签：典籍/科普","jq":[["小寒","1 月 5 日","小寒时处二三九，天寒地冻冷到抖（流传）"],["大寒","1 月 20 日","大寒到顶点，日后天渐暖（流传）"],["立春","2 月 4 日","立春一年端，种地早盘算（流传）"],["雨水","2 月 18 日","雨水到来地解冻，化作长江第一泓（流传）"],["惊蛰","3 月 5 日","惊蛰一声雷，万物始回春"],["春分","3 月 20 日","春分昼夜平分，此后白天一天长一线"],["清明","4 月 5 日","清明时节雨纷纷，扫墓踏青"],["谷雨","4 月 20 日","谷雨断霜不断雨，春雨贵如油（流传）"],["立夏","5 月 5 日","立夏见夏，称人、吃蛋是老讲究（流传）"],["小满","5 月 21 日","小满小满，麦粒渐满"],["芒种","6 月 5 日","芒种忙忙种，夏收夏种最忙时"],["夏至","6 月 21 日","夏至白天最长；吃过夏至面，一天短一线（流传）"],["小暑","7 月 7 日","小暑过，一日热三分（流传）"],["大暑","7 月 23 日","大暑一年里最热的时段"],["立秋","8 月 7 日","立秋贴秋膘，早晚添凉意（流传）"],["处暑","8 月 23 日","处暑出暑，暑气到此为止"],["白露","9 月 7 日","白露身不露，早晚防着凉（流传）"],["秋分","9 月 23 日","秋分昼夜平分，此后夜长日短"],["寒露","10 月 8 日","寒露寒露，遍地冷露"],["霜降","10 月 23 日","霜降见霜，谷子满仓（流传）"],["立冬","11 月 7 日","立冬补冬，补嘴空（流传，指食俗）"],["小雪","11 月 22 日","小雪雪将临，该给家里添冬衣了"],["大雪","12 月 7 日","大雪纷纷落，瑞雪兆丰年（流传）"],["冬至","12 月 22 日","冬至白天最短；吃了冬至面，一天长一线（流传）"]],"jqNote":"2026 年交节日期经历算工具（sxtwl）逐日核定；其他年份日期前后浮动 1–2 天","jqTag":"可靠性标签：日期＝历算实测；老话＝流传","jr":[["春节","正月初一","一年之首，拜年、守岁、贴春联"],["元宵节","正月十五","赏灯、吃元宵（汤圆），正月的收尾"],["龙抬头","二月初二","相传龙在此日抬头；理发、炒豆是老讲究（流传）"],["花朝节","二月十二","相传是百花的生日，踏青赏花、赏红（流传）"],["上巳节","三月初三","古人水边修禊踏青，《兰亭集序》记的就是这天"],["清明节","公历 4 月 5 日前后（节气）","扫墓祭祖、踏青"],["端午节","五月初五","包粽子、挂菖蒲艾草；问候说安康"],["七夕节","七月初七","牛郎织女传说，姑娘乞巧（传说）"],["中元节","七月十五","祭祖，与清明、寒衣并称三大祭祖节日"],["中秋节","八月十五","赏月、吃月饼，团圆节"],["重阳节","九月初九","登高、赏菊、敬老，「九九」图长久"],["寒衣节","十月初一","送寒衣、祭先人，三大祭祖节日之一"],["下元节","十月十五","水官解厄之说（流传/相传）"],["腊八节","腊月初八","喝腊八粥；注意：是腊月初八，不是冬月初八"],["小年","腊月廿三（北）/廿四（南）","祭灶；南方廿四兼扫房子，各地不同"],["除夕","腊月最后一天","团年、守岁；腊月小月时廿九即除夕"]],"jrTag":"可靠性标签：日期与节俗＝科普/典籍；标注流传者为民间说法","yc":[{"title":"一、夏令时：1986–1991 年出生的，钟点要拨回 1 小时","lines":["1986 年到 1991 年，我国实行过夏令时：每年春天把钟拨快 1 小时，秋天拨回。那几年夏天出生的人，出生证上写的钟点是拨快过的，对时辰要**拨回 1 小时**，按当时的标准时间（太阳的正经时间）算。","","逐年实行日期（起止日当天凌晨 2 点切换）：","","| 年份 | 开始（拨快 1 小时） | 结束（拨回） |","|---|---|---|","| 1986 | 5 月 4 日 | 9 月 14 日 |","| 1987 | 4 月 12 日 | 9 月 13 日 |","| 1988 | 4 月 17 日 | 9 月 11 日 |","| 1989 | 4 月 16 日 | 9 月 17 日 |","| 1990 | 4 月 15 日 | 9 月 16 日 |","| 1991 | 4 月 14 日 | 9 月 15 日 |","","例子：1988 年 7 月 1 日凌晨 1 点半出生——夏令时期间，拨回 1 小时是 0 点半，对的是**子时**，不是按字面的丑时。","可靠性标签：科普（国家夏令时实行记录）"]},{"title":"二、闰月：多出来的那个月，沿用前一个月的名","lines":["农历十九年里约有七个闰年，多出来的月份叫闰月。规矩三条：","1. 闰月**沿用它所补那个月的名字和排位**：闰五月还是五月，叫榴月、仲夏；古人管它叫「后五月」。","2. **生日不推迟**：闰月出生的人，过生日就按这个月的日子过，年年都过，不必等下个闰月。","3. 闰哪个月由节气定，不是人为挑的；下一个闰五月在 2028 年。","","例子：1971 年有闰五月，闰五月廿四出生，换成公历是 1971 年 7 月 16 日（历算核定）。","可靠性标签：科普/历算"]},{"title":"三、子时跨日：23 点多出生，算哪一天","lines":["古人有「子时换日」的讲法，现代以 0 点为界，出生证也是这么记的：**23:00–24:00 出生记当天，00:00–01:00 出生记次日**，时辰都是子时。对照时按这个口径，不必纠结古法。","可靠性标签：科普","",""]}],"wt":[{"q":"问 1：我只知道出生几点，怎么对时辰？","a":"答：记住「整点交班」：7 点整起是辰时，9 点整起是巳时，往下照全表推。拿不准的，用本站「查时辰」，输钟点直接出结果。"},{"q":"问 2：我是阳历生日，怎么换成农历？","a":"答：阳历换农历必须有出生年份——同是阳历 4 月 12 日，不同年份对应的农历能差出一个月。用「查月份」时按提示填年份，或翻当年老黄历核对。"},{"q":"问 3：1988 年夏天出生的，时辰总对不上，是怎么回事？","a":"答：多半是夏令时。1986–1991 年实行过夏令时，那几年夏天出生，出生证钟点要拨回 1 小时再对（见第四编第一节·夏令时，有逐年日期表）。"},{"q":"问 4：闰月出生的人，月份怎么算、生日怎么过？","a":"答：沿用所补月份的名字和排位；生日照这个月的日子年年正常过，不推迟、不等闰年（见第四编第二节·闰月）。"},{"q":"问 5：我在家里排行老四，为什么月份表里没有老四？","a":"答：孟仲季只给季节排到第三，这是老规矩——不是漏了您。家中排行和月份排位是两套账，各走各的；老四往下多半是家里最小的，被疼大的位置。"},{"q":"问 6：「几月的马最好？」","a":"答：本站不排这个名次。民间倒流传着属相月令老歌，有的版本把三月、七月、八月的马排在前面，也有别的歌把五月马算作旺月，版本互相矛盾——这些只当文化谈资看看，谁也不必对号入座。日子是自己过出来的，不是一个月决定的。"},{"q":"问 7：月份的雅称（桂月、荷月）是哪里来的？","a":"答：多来自这个月的花信物候和历代诗词：八月桂花开叫桂月，六月荷花开叫荷月，三月桃花叫桃月。集中出处见第六编出处总表。"},{"q":"问 8：出生在新疆、黑龙江，时辰要按真太阳时调吗？","a":"答：日常对照不用调。全国统一用北京时间，出生证也按北京时间记；真太阳时差只在最西边的地方才明显，普通人对时辰按钟点查表即可，别把简单事弄复杂。"},{"q":"问 9：晚上 11 点多出生，到底算今天还是明天？","a":"答：按现代口径：23 点多记当天，过了 0 点记次日，时辰都是子时（见第四编第三节·子时跨日）。"},{"q":"问 10：你们这儿能算命吗？","a":"答：不能。命理是一门老学问，自有它的历史，本站不贬低它；但本站只做传统时间文化科普——把时辰、月份、节气的来历出处讲明白。日子是过出来的，不是算出来的。"}],"cc":[["《淮南子·天文训》","十二时辰别名顺序（夜半、鸡鸣、平旦、日出、食时、隅中、日中、日昳、晡时、日入、黄昏、人定）"],["《淮南子·时则训》","按月物候、月份时令"],["《说文解字》","「辰，震也」「羊，祥也」等字义"],["《诗经》","丑时鸡鸣（郑风·女曰鸡鸣）、上巳（溱洧）、酉时（君子于役、鸡栖于埘）"],["《礼记·月令》","月份时令、节气物候的头号原典"],["《尔雅》","冬月别称「辜月」等岁时名"],["《汉书·律历志》","历法与计时制度"],["《梦溪笔谈》","十二气历、漏刻计时等条目"],["《孔雀东南飞》","亥时人定：「奄奄黄昏后，寂寂人定初」"],["唐·张继《枫桥夜泊》","子时夜半：「夜半钟声到客船」"],["晋·王羲之《兰亭集序》","三月初三上巳修禊"],["东晋《占书》（托名东方朔）","正月头七天六畜人日序、初五牛日"],["宋·苏轼诗","八月十八钱塘潮：「八月十八潮，壮观天下无」"],["宋·李清照《鹧鸪天·桂花》","「暗淡轻黄体性柔，情疏迹远只香留」"],["唐·韩愈诗","五月榴花：「五月榴花照眼明」"],["中央纪委国家监委网站《唐诗宋词里的十二时辰》（2019-07-22）","时辰对照的官方科普口径（子时 23:00–01:00 夜半、丑时鸡鸣等）"],["出土秦汉简牍（睡虎地等）","秦汉一日两餐（饔/飧）、早餐粥饼菜羹的生活记录"],["国家夏令时实行记录（1986–1991）","夏令时逐年起止日期"]],"ccNote":"全站内容只讲传统文化，不涉及命理吉凶；民间流传说法均已标注，可靠性以本表与各节标签为准。"};

function toolSc(){return '<h2>查时辰</h2><p>出生钟点（24 小时制）</p><p><input class="n" id="h" inputmode="numeric" maxlength="2" placeholder="时" aria-label="时"> ： <input class="n" id="m" inputmode="numeric" maxlength="2" placeholder="分" aria-label="分"></p><p>选填：出生年、月、日。只用来帮您核对夏令时，不保存。</p><p><input class="y" id="y" inputmode="numeric" maxlength="4" placeholder="年" aria-label="年"> <input class="n" id="mo" inputmode="numeric" maxlength="2" placeholder="月" aria-label="月"> <input class="n" id="d" inputmode="numeric" maxlength="2" placeholder="日" aria-label="日"></p><button class="btn" onclick="goSc()">查时辰</button><div id="out"></div>'}
function dst(y,mo,d,t){const p=D.j.dst_china_1986_1991.periods.find(p=>p.year==y);if(!p)return false;const k=y*10000+mo*100+d,s=+p.start.replace(/-/g,''),e=+p.end.replace(/-/g,'');return (k>s&&k<e)||(k==s&&t>=120)||(k==e&&t<120)}
function dstEnd(y,mo,d){const p=D.j.dst_china_1986_1991.periods.find(p=>p.year==y);return !!p&&y*10000+mo*100+d==+p.end.replace(/-/g,'')}function find(t){for(let i=0;i<12;i++){const s=D.j.shichen[i],a=hm(s.start),b=hm(s.end);if(s.crossDay?(t>=a||t<b):(t>=a&&t<b))return i}}
function num(id){const v=$('#'+id).value.trim();return /^\d+$/.test(v)?+v:NaN}
function goSc(){const o=$('#out'),h=num('h'),m=num('m');
if(!(h>=0&&h<=23&&m>=0&&m<=59)){o.innerHTML='<p class="er">请填写正确的钟点：时填 0 到 23，分填 0 到 59。</p>';return}
const y=num('y'),mo=num('mo'),d=num('d'),any=$('#y').value||$('#mo').value||$('#d').value;let t=h*60+m,ds=false,note='';
if(any){const dt=new Date(y,mo-1,d);if(y>=1&&mo>=1&&mo<=12&&d>=1&&dt.getMonth()==mo-1&&dt.getDate()==d)ds=dst(y,mo,d,t);else note='<p class="tip">年、月、日要填完整、填对，才能核对夏令时；这次按您填的钟点直接对照。</p>'}
const t0=t,i0=find(t0);if(ds)t=(t0-60+1440)%1440;const i=find(t),x=D.sc[i];
let h2=note;if(ds)h2+='<div class="tip"><b>您出生时正赶上夏令时，出生证钟点要拨回 1 小时——已按拨回后的时间为您对照。</b><br>原钟点 '+fmt(t0)+' → '+E(D.sc[i0].name)+'；拨回 '+fmt(t)+' → '+E(x.name)+'。<br><a href="#yc-1">看第四编第一节</a></div>'+(ds&&t0>=60&&t0<120&&dstEnd(y,mo,d)?'<p class="tip">另请注意：这天凌晨钟表拨回过一小时，1 点多这个钟点当天出现过两次。上面的结果按拨回之前（夏令时）那一次算；若出生记录是拨回之后的那一次，请按原钟点直接对，即'+E(D.sc[i0].name)+'，不用拨回。</p>':'');
if(i==0)h2+='<p class="tip">'+E(D.j.shichen_rules.zi_cross_day)+'。按您的钟点，'+(t>=1380?'记当天。':'记次日。')+'</p>';
R={big:x.name,l1:x.alias,l2:x.hours,src:D.scSmall.split('可靠性标签')[0]};
o.innerHTML=h2+'<div class="big">'+E(x.name)+'</div><p class="mid">'+E(x.alias)+' · '+E(x.hours)+'</p>'+body(x)+'<button class="btn" onclick="mk()">生成我的对照卡</button><div id="cd"></div><a class="btn o" href="#tool-sc" onclick="setTimeout(function(){$(\'#h\').focus()},50)">再查一个</a><a class="btn o" href="#sc">看时辰全表</a>';o.scrollIntoView()}
